<div class="py-16 min-h-screen bg-dark-bg">
  <section id="projects" class=" py-16 bg-dark-bg">
    <div class="w-full max-w-5xl mx-auto px-6">

      <div class="mb-16 text-center">
        <h2 class="text-3xl md:text-4xl font-semibold text-white mb-3 tracking-tight">
          Projects
        </h2>
        <p class="text-neutral-400 text-base">
          Real applications I've built from scratch.
        </p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 lg:gap-6">
        @for (project of projects; track project.title) {
          <div class="bg-surface border border-border rounded-2xl overflow-hidden
                      hover:border-neutral-700 transition-colors group">

            <!-- Screenshot -->
            <div class="w-full aspect-video bg-neutral-900 overflow-hidden">
              <img
                [src]="project.image"
                [alt]="project.title"
                class="w-full h-full object-cover object-top
                       group-hover:scale-[1.02] transition-transform duration-500"
              />
            </div>

            <!-- Info -->
            <div class="p-5 md:p-7">
              <div class="flex items-start justify-between gap-4 mb-3">
                <h3 class="text-white font-semibold text-xl">{{ project.title }}</h3>

                <!-- Links -->
                <div class="flex items-center gap-2 shrink-0">
                  <a
                    [href]="project.github"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="flex items-center justify-center h-8 w-8 text-xs text-neutral-400
                            hover:text-white border border-border hover:border-neutral-600
                            p-1 rounded-lg transition-colors"
                  >
                    <app-icon name="github" [size]="14"></app-icon>
                  </a>
                  <a
                    [href]="project.demo"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="flex items-center leading-0 gap-2 h-8 border border-border hover:border-neutral-600
                             hover:text-white text-neutral-400 text-xs font-medium 
                            px-3 py-1.5 rounded-lg transition-colors"
                  >
                    Live demo
                    <app-icon name="external-link" [size]="14"></app-icon>
                  </a>
                </div>
              </div>

              <p class="text-sm text-neutral-400 leading-relaxed mb-5">
                {{ project.description }}
              </p>

              <!-- Tags -->
              <div class="flex flex-wrap gap-2">
                @for (tag of project.tags; track tag) {
                  <span class="text-[11px] bg-neutral-900 border border-border
                               text-neutral-500 px-2.5 py-1 rounded-md">
                    {{ tag }}
                  </span>
                }
              </div>
            </div>

          </div>
        }
      </div>

    </div>
  </section>
</div>
