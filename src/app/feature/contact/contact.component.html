<div class="pt-24 min-h-screen flex items-center justify-center">
  <section class="py-16 w-full max-w-lg mx-auto px-6">
    <div class="mb-10 text-center">
      <h2 class="text-3xl md:text-4xl font-semibold text-white mb-3 tracking-tight">
        Let's work together
      </h2>
      <p class="text-neutral-400 text-base">
        Open to junior frontend roles. Drop me a message.
      </p>
    </div>

    <!-- Success state -->
    @if (sent()) {
      <div class="bg-surface border border-border rounded-2xl p-10 text-center">
        <app-icon name="cicrle-check" [size]="36" class="mb-2" />
        <p class="text-white font-medium mb-1">Message sent!</p>
        <p class="text-neutral-400 text-sm">I'll get back to you within a day.</p>
        <button
          (click)="sent.set(false)"
          class="mt-6 cursor-pointer text-xs text-neutral-500 hover:text-white transition-colors">
          Send another
        </button>
      </div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="sendEmail()">
        <div class="flex flex-col gap-5 bg-surface border border-border p-8 rounded-2xl">
            <!-- Name -->
          <div class="flex flex-col gap-1.5">
            <label class="text-xs text-neutral-400 font-medium">Name</label>
            <input
              type="text"
              [formControl]="$any(form.get('name'))"
              placeholder="Lazizbek"
              class="bg-neutral-900 border border-neutral-800 text-white text-sm
                    rounded-lg w-full px-3 py-2.5 outline-none transition-colors
                    focus:border-neutral-600 placeholder:text-neutral-600"
            />
          </div>

          <!-- Email -->
          <div class="flex flex-col gap-1.5">
            <label class="text-xs text-neutral-400 font-medium">Email</label>
            <input
              type="email"
              [formControl]="$any(form.get('email'))"
              placeholder="lazizbek@example.com"
              class="bg-neutral-900 border border-neutral-800 text-white text-sm
                    rounded-lg w-full px-3 py-2.5 outline-none transition-colors
                    focus:border-neutral-600 placeholder:text-neutral-600"
            />
          </div>

          <!-- Message -->
          <div class="flex flex-col gap-1.5">
            <label class="text-xs text-neutral-400 font-medium">Message</label>
            <textarea
              rows="4"
              [formControl]="$any(form.get('message'))"
              placeholder="Tell me about the role or project..."
              class="bg-neutral-900 border border-neutral-800 text-white text-sm
                    rounded-lg w-full px-3 py-2.5 outline-none transition-colors
                    focus:border-neutral-600 placeholder:text-neutral-600 resize-none"
            ></textarea>
          </div>

          <!-- Error -->
          @if (error()) {
            <p class="text-xs text-red-400">{{ error() }}</p>
          }

          <!-- Submit -->
          <app-button
            [disabled]="sending() || form.invalid"
            type="submit"
            label="Send message"
            severity="angular"
            [loading]="sending()"
          />
        </div>
      </form>
    }
  </section>
</div>
