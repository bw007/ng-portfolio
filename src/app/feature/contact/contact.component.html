<div class="pt-24 min-h-screen bg-dark-bg flex items-center justify-center">
  <section class="py-16 w-full max-w-2xl mx-auto px-6">
    <div class="mb-12 text-center">
      <h2 class="text-3xl md:text-4xl font-semibold text-white mb-4 tracking-tight">Let's Connect</h2>
      <p class="text-neutral-400 font-sans text-lg">
        Interested in working together? Drop me a message below.
      </p>
    </div>

    <form class="flex flex-col gap-6 bg-surface border border-border p-8 rounded-2xl">
      <div class="flex flex-col gap-2">
        <label for="name" class="text-sm text-neutral-300 font-medium">Name</label>
        <input type="text" id="name" class="bg-neutral-900 border border-neutral-700 text-white text-sm rounded-lg focus:ring-angular-modern focus:border-angular-modern block w-full p-3 transition-colors outline-none" placeholder="Your name">
      </div>
      
      <div class="flex flex-col gap-2">
        <label for="email" class="text-sm text-neutral-300 font-medium">Email</label>
        <input type="email" id="email" class="bg-neutral-900 border border-neutral-700 text-white text-sm rounded-lg focus:ring-angular-modern focus:border-angular-modern block w-full p-3 transition-colors outline-none" placeholder="name@example.com">
      </div>

      <div class="flex flex-col gap-2">
        <label for="message" class="text-sm text-neutral-300 font-medium">Message</label>
        <textarea id="message" rows="4" class="bg-neutral-900 border border-neutral-700 text-white text-sm rounded-lg focus:ring-angular-modern focus:border-angular-modern block w-full p-3 transition-colors outline-none" placeholder="Tell me about your project..."></textarea>
      </div>

      <button type="button" class="mt-2 w-full bg-angular-modern hover:bg-angular-accent text-white font-medium rounded-lg text-sm px-5 py-3 text-center transition-colors">
        Send Message
      </button>
    </form>
  </section>
</div>
