<header class="fixed top-0 left-0 right-0 z-50 glass-nav py-3.5">
  <div class="w-full max-w-6xl mx-auto px-6 flex justify-between items-center relative">
    
    <!-- Logo -->
    <div class="flex items-center gap-2 font-semibold text-lg text-white">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 250 250">
        <path d="M125 30L31.9 63.2l14.2 123.1L125 230l78.9-43.7 14.2-123.1z" fill="#dd0031"/>
        <path d="M125 30v200l78.9-43.7 14.2-123.1z" fill="#c3002f"/>
        <path d="M125 52.1l66.8 149.2h-21.4l-14.7-37.1H94.3l-14.7 37.1H58.2z" fill="#fff"/>
        <path d="M125 52.1v94h33.8z" fill="#eee"/>
      </svg>
      NgPortfolio
    </div>

    <!-- Desktop Navigation -->
    <nav class="hidden md:flex gap-8 text-sm font-medium text-neutral-400">
      <a href="#about" class="hover:text-white transition-colors">About</a>
      <a href="#skills" class="hover:text-white transition-colors">Skills</a>
      <a href="#projects" class="hover:text-white transition-colors">Projects</a>
      <a href="#contact" class="hover:text-white transition-colors">Contact</a>
    </nav>

    <!-- Desktop Call to Action -->
    <a href="#contact" class="hidden md:flex items-center gap-2 bg-white text-black px-4 py-2 rounded-full text-sm font-semibold hover:bg-neutral-200 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right-icon lucide-chevron-right"><path d="m9 18 6-6-6-6"/></svg>
      Hire Me
    </a>

    <!-- Hamburger Button (Mobile) -->
    <label 
      (click)="toggleMenu()" 
      class="cursor-pointer md:hidden flex z-50 items-center color-white justify-center rounded-full"
    >
      <svg 
        viewBox="0 0 32 32" 
        class="hamburger-svg h-8"
        [class.active]="isMobileMenuOpen()"
      >
        <path class="line line-top-bottom" d="M27 10 13 10C10.8 10 9 8.2 9 6 9 3.5 10.8 2 13 2 15.2 2 17 3.8 17 6L17 26C17 28.2 18.8 30 21 30 23.2 30 25 28.2 25 26 25 23.8 23.2 22 21 22L7 22"></path>
        <path class="line" d="M7 16 27 16"></path>
      </svg>
    </label>
  </div>

  <!-- Mobile Sidebar Overlay -->
  <div class="fixed inset-0 w-full h-screen z-40 md:hidden transition-opacity duration-300" 
       [class.opacity-100]="isMobileMenuOpen()" 
       [class.pointer-events-auto]="isMobileMenuOpen()"
       [class.opacity-0]="!isMobileMenuOpen()"
       [class.pointer-events-none]="!isMobileMenuOpen()">
    
    <div class="absolute inset-0 bg-black/80 backdrop-blur-md" (click)="closeMenu()"></div>
    
    <div class="absolute top-0 right-0 w-[250px] sm:w-[300px] h-screen bg-[#111111] shadow-2xl transition-transform duration-300 ease-in-out flex flex-col pt-24 px-8"
         [class.translate-x-0]="isMobileMenuOpen()"
         [class.translate-x-full]="!isMobileMenuOpen()">
      
      <nav class="flex flex-col gap-6 text-lg font-medium text-neutral-400">
        <a href="#about" (click)="closeMenu()" class="hover:text-white transition-colors">About</a>
        <a href="#skills" (click)="closeMenu()" class="hover:text-white transition-colors">Skills</a>
        <a href="#projects" (click)="closeMenu()" class="hover:text-white transition-colors">Projects</a>
        <a href="#contact" (click)="closeMenu()" class="hover:text-white transition-colors">Contact</a>
      </nav>

      <a href="#contact" (click)="closeMenu()" class="mt-8 flex justify-center items-center gap-2 bg-angular-modern text-white px-4 py-3 rounded-full text-base font-semibold hover:bg-angular-pink transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"></path>
          <path d="m12 5 7 7-7 7"></path>
        </svg>
        Hire Me
      </a>
    </div>
  </div>
</header>
